services:
  - type: web
    name: pyflutter-radar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCAN_INTERVAL_MINUTES
        value: 60
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pyflutter-radar-db
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: pyflutter-radar-db
    plan: free
    databaseName: pyflutter_radar

